apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaoutar-portfolio
  namespace: dev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: kaoutar-portfolio

  template:
    metadata:
      labels:
        app: kaoutar-portfolio

    spec:
      containers:
        - name: portfolio
          image: kaoutar-portfolio:v1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: kaoutar-portfolio
  namespace: dev

spec:
  selector:
    app: kaoutar-portfolio

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP